name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: flutter-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter (latest stable, no cache)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Download Cairo fonts
        run: |
          mkdir -p assets/fonts
          curl -fL -o assets/fonts/Cairo-Regular.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/cairo/Cairo%5Bslnt%2Cwght%5D.ttf"
          cp assets/fonts/Cairo-Regular.ttf assets/fonts/Cairo-Bold.ttf
          echo "✅ Fonts downloaded"
          ls -la assets/fonts/

      - name: Force recreate Android platform
        run: |
          rm -rf android
          flutter create \
            --platforms=android \
            --org com.itqanpos \
            --project-name hesabi_sales_rep \
            --description "Hesabi Sales Rep - Mobile app for sales representatives" \
            .
          echo "✅ Android platform created"

      - name: Verify Android platform created
        run: |
          if [ ! -f "android/app/build.gradle.kts" ] && [ ! -f "android/app/build.gradle" ]; then
            echo "❌ Android platform not created properly"
            exit 1
          fi
          echo "✅ Android build.gradle verified"

      - name: Install dependencies
        run: flutter pub get

      - name: Remove default test & add sanity test
        run: |
          rm -rf test
          mkdir -p test
          cat > test/sanity_test.dart <<'EOF'
          import 'package:flutter_test/flutter_test.dart';
          void main() {
            test('sanity check', () => expect(2 + 2, 4));
          }
          EOF

      # ⬇️⬇️⬇️ حماية تلقائية للوجو
      - name: Ensure logo exists (auto-generate if missing)
        run: |
          mkdir -p assets/images
          if [ -f "assets/images" ]; then
            echo "⚠️  assets/images exists as file — removing"
            rm -f "assets/images"
            mkdir -p assets/images
          fi

          if [ ! -f "assets/images/logo.png" ]; then
            echo "⚠️  logo.png not found — generating placeholder (Hesabi green)"
            python3 <<'PY'
import struct, zlib

def create_png(width, height, r, g, b):
    signature = b'\x89PNG\r\n\x1a\n'
    def chunk(t, d):
        return struct.pack('>I', len(d)) + t + d + struct.pack('>I', zlib.crc32(t + d) & 0xffffffff)
    ihdr = struct.pack('>IIBBBBB', width, height, 8, 2, 0, 0, 0)
    raw = b''
    for y in range(height):
        row = b'\x00'
        for x in range(width):
            cx, cy = width/2, height/2
            dist = ((x-cx)**2 + (y-cy)**2)**0.5
            if dist < width * 0.35:
                row += bytes([255, 255, 255])
            elif dist < width * 0.42:
                row += bytes([0, 105, 92])
            else:
                row += bytes([r, g, b])
        raw += row
    return signature + chunk(b'IHDR', ihdr) + chunk(b'IDAT', zlib.compress(raw, 9)) + chunk(b'IEND', b'')

with open('assets/images/logo.png', 'wb') as f:
    f.write(create_png(512, 512, 0, 137, 123))
print("✅ Placeholder logo created (512x512)")
PY
          else
            echo "✅ logo.png found:"
            ls -la assets/images/logo.png
          fi

      # ⬇️⬇️⬇️ توليد الأيقونات
      - name: Generate Launcher Icons
        run: dart run flutter_launcher_icons

      - name: Set minSdk 23 / compileSdk 36 / targetSdk 36
        run: |
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            if [ -f "$f" ]; then
              sed -i 's/minSdkVersion flutter\.minSdkVersion/minSdkVersion 23/' "$f" || true
              sed -i 's/minSdk = flutter\.minSdkVersion/minSdk = 23/' "$f" || true
              sed -i 's/minSdkVersion 21/minSdkVersion 23/' "$f" || true
              sed -i 's/minSdk = 21/minSdk = 23/' "$f" || true
              sed -i 's/compileSdkVersion flutter\.compileSdkVersion/compileSdkVersion 36/' "$f" || true
              sed -i 's/compileSdk = flutter\.compileSdkVersion/compileSdk = 36/' "$f" || true
              sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 36/' "$f" || true
              sed -i 's/compileSdk = [0-9]*/compileSdk = 36/' "$f" || true
              sed -i 's/targetSdkVersion flutter\.targetSdkVersion/targetSdkVersion 36/' "$f" || true
              sed -i 's/targetSdk = flutter\.targetSdkVersion/targetSdk = 36/' "$f" || true
              sed -i 's/targetSdkVersion [0-9]*/targetSdkVersion 36/' "$f" || true
              sed -i 's/targetSdk = [0-9]*/targetSdk = 36/' "$f" || true
            fi
          done

      - name: Patch compileSdk for ALL plugins
        run: |
          set -e
          PUB_CACHE_ROOT="${PUB_CACHE:-$HOME/.pub-cache}/hosted/pub.dev"
          if [ ! -d "$PUB_CACHE_ROOT" ]; then
            echo "!! pub-cache root not found at $PUB_CACHE_ROOT"
            exit 1
          fi
          python3 - "$PUB_CACHE_ROOT" <<'PY'
          import re, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          total = 0
          patched = 0
          for pkg in sorted(root.iterdir()):
              if not pkg.is_dir(): continue
              android_dir = pkg / 'android'
              if not android_dir.is_dir(): continue
              for fname in ('build.gradle', 'build.gradle.kts'):
                  f = android_dir / fname
                  if not f.exists(): continue
                  total += 1
                  text = f.read_text()
                  original = text
                  text = re.sub(r'compileSdkVersion\s*=?\s*[0-9]+', 'compileSdkVersion 36', text)
                  text = re.sub(r'compileSdkVersion\(\s*[0-9]+\s*\)', 'compileSdkVersion(36)', text)
                  text = re.sub(r'compileSdk\s*=\s*[0-9]+', 'compileSdk = 36', text)
                  text = re.sub(r'compileSdk\(\s*[0-9]+\s*\)', 'compileSdk(36)', text)
                  text = re.sub(r'\bcompileSdk\s+[0-9]+\b', 'compileSdk 36', text)
                  text = re.sub(r'compileSdkVersion\s*=?\s*project\.flutter\.compileSdkVersion', 'compileSdkVersion 36', text)
                  text = re.sub(r'compileSdk\s*=?\s*project\.flutter\.compileSdkVersion', 'compileSdk = 36', text)
                  text = re.sub(r'compileSdkVersion\s*=?\s*flutter\.compileSdkVersion', 'compileSdkVersion 36', text)
                  text = re.sub(r'compileSdk\s*=?\s*flutter\.compileSdkVersion', 'compileSdk = 36', text)
                  if text != original:
                      f.write_text(text)
                      patched += 1
          print(f'Scanned: {total}, Patched: {patched}')
          PY

      - name: Add Android permissions
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i '/<application/i\    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"
          fi
          if ! grep -q 'android.permission.CAMERA' "$MANIFEST"; then
            sed -i '/<application/i\    <uses-permission android:name="android.permission.CAMERA" />' "$MANIFEST"
          fi
          if ! grep -q 'android.permission.BLUETOOTH_SCAN' "$MANIFEST"; then
            sed -i '/<application/i\    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />' "$MANIFEST"
            sed -i '/<application/i\    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />' "$MANIFEST"
          fi
          if ! grep -q 'android.permission.BLUETOOTH_ADMIN' "$MANIFEST"; then
            sed -i '/<application/i\    <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />' "$MANIFEST"
            sed -i '/<application/i\    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />' "$MANIFEST"
          fi
          if ! grep -q 'ACCESS_FINE_LOCATION' "$MANIFEST"; then
            sed -i '/<application/i\    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />' "$MANIFEST"
            sed -i '/<application/i\    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' "$MANIFEST"
          fi
          if ! grep -q 'EnableImpeller' "$MANIFEST"; then
            python3 - <<'PY'
          import pathlib
          p = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          text = p.read_text()
          text = text.replace('</application>', '    <meta-data android:name="io.flutter.embedding.android.EnableImpeller" android:value="false" />\n    </application>')
          p.write_text(text)
          PY
          fi

      - name: Create ProGuard rules
        run: |
          mkdir -p android/app
          cat > android/app/proguard-rules.pro <<'EOF'
          -keep class com.google.mlkit.** { *; }
          -keep class com.google.android.gms.internal.mlkit_vision_barcode.** { *; }
          -keep class com.google.android.libraries.barhopper.** { *; }
          -keep class dev.steenbakker.mobile_scanner.** { *; }
          EOF

      - name: Link ProGuard rules
        run: |
          python3 - <<'PY'
          import pathlib, re
          for fname in ('android/app/build.gradle', 'android/app/build.gradle.kts'):
              p = pathlib.Path(fname)
              if not p.exists(): continue
              text = p.read_text()
              if 'proguard-rules.pro' in text:
                  continue
              if fname.endswith('.kts'):
                  text = re.sub(
                      r'(buildTypes\s*\{[\s\S]*?release\s*\{)',
                      r'\1\n            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")',
                      text, count=1,
                  )
              else:
                  text = re.sub(
                      r'(release\s*\{)',
                      r'\1\n            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"',
                      text, count=1,
                  )
              p.write_text(text)
          PY

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build Release APK
        run: |
          flutter build apk --release \
            --target-platform=android-arm64,android-arm \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Collect APK (stable filename)
        run: |
          mkdir -p build/apk
          cp build/app/outputs/flutter-apk/app-release.apk \
             "build/apk/hesabi-sales-rep.apk"
          SIZE=$(du -h build/apk/hesabi-sales-rep.apk | cut -f1)
          echo "APK_SIZE=$SIZE" >> $GITHUB_ENV
          echo "✅ APK ready: $SIZE"

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hesabi-sales-rep-apk-build${{ github.run_number }}
          path: build/apk/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish to Releases (apk-latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "Hesabi Sales Rep APK - آخر إصدار"
          body: |
            ## 📱 Hesabi Sales Rep — آخر إصدار

            **رقم البناء:** #${{ github.run_number }}
            **تاريخ البناء:** ${{ github.event.head_commit.timestamp || 'auto' }}
            **حجم الملف:** ${{ env.APK_SIZE }}
            **Commit:** `${{ github.sha }}`

            ---

            ### 📥 رابط التحميل المباشر (دائم):
            [**اضغط هنا لتحميل أحدث نسخة**](https://github.com/itqanpos/hesabi_sales_rep/releases/latest/download/hesabi-sales-rep.apk)

            **أو انسخ هذا الرابط للمفضلة:**
