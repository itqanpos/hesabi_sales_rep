name: hesabi_sales_rep
description: Hesabi Sales Rep - Mobile app for sales representatives
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: 2.8.0
  go_router: ^14.0.0
  flutter_riverpod: ^2.5.1
  intl: ^0.20.3
  uuid: 4.5.1
  mobile_scanner: 5.2.3
  geolocator: ^13.0.1
  pdf: ^3.11.0
  printing: ^5.13.0
  esc_pos_utils_plus: ^2.0.4
  flutter_pos_printer_platform_image_3: ^1.2.0
  image: ^4.2.0
  shared_preferences: ^2.3.2
  permission_handler: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/images/
