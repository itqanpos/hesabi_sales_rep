name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: "android-build-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      # ⬇️⬇️ تحميل خطوط Cairo (روابط محدثة تعمل 100%)
      - name: Download Cairo fonts
        run: |
          mkdir -p assets/fonts
          curl -fL -o assets/fonts/Cairo-Regular.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/cairo/Cairo%5Bslnt%2Cwght%5D.ttf"
          cp assets/fonts/Cairo-Regular.ttf assets/fonts/Cairo-Bold.ttf
          echo "✅ Fonts downloaded:"
          ls -la assets/fonts/

      # ⬇️⬇️ حذف مجلد أندرويد القديم وإنشاء جديد لضمان v2
      - name: Force recreate Android platform
        run: |
          rm -rf android
          flutter create --platforms=android --org com.itqanpos --project-name hesabi_sales_rep .
          echo "✅ Android platform created."

      # ⬇️⬇️ كتابة MainActivity.kt يدوياً (لضمان v2)
      - name: Force write MainActivity.kt
        run: |
          mkdir -p android/app/src/main/kotlin/com/itqanpos/hesabi_sales_rep
          cat > android/app/src/main/kotlin/com/itqanpos/hesabi_sales_rep/MainActivity.kt <<'EOF'
          package com.itqanpos.hesabi_sales_rep

          import io.flutter.embedding.android.FlutterActivity

          class MainActivity: FlutterActivity()
          EOF
          echo "✅ MainActivity.kt written."

      # ⬇️⬇️ كتابة AndroidManifest.xml يدوياً (أذونات + v2)
      - name: Force write AndroidManifest.xml
        run: |
          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30"/>
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30"/>
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation"/>
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>

              <application
                  android:label="Hesabi Sales Rep"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:taskAffinity=""
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
              <queries>
                  <intent>
                      <action android:name="android.intent.action.PROCESS_TEXT"/>
                      <data android:mimeType="text/plain"/>
                  </intent>
              </queries>
          </manifest>
          EOF
          echo "✅ AndroidManifest.xml written."

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # ⬇️⬇️ البناء
      - name: Build Release APK
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Check APK size
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          if [ -f "$APK" ]; then
            SIZE=$(du -h "$APK" | cut -f1)
            echo "APK_SIZE=$SIZE" >> $GITHUB_ENV
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hesabi-sales-rep-apk-v${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Summary
        run: |
          {
            echo "## ✅ تم بناء APK بنجاح"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **الإصدار** | v${{ github.run_number }} |"
            echo "| **حجم APK** | ${{ env.APK_SIZE }} |"
          } >> $GITHUB_STEP_SUMMARY
