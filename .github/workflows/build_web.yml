name: Build & Deploy Web

on:
  push:
    branches: [main]
  workflow_dispatch:

# منع قفل النشر المتزامن في GitHub Pages
concurrency:
  group: "pages"
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      # ⬇️⬇️ تحميل خطوط Cairo (روابط محدثة تعمل 100%)
      - name: Download Cairo fonts
        run: |
          mkdir -p assets/fonts
          curl -fL -o assets/fonts/Cairo-Regular.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/cairo/Cairo%5Bslnt%2Cwght%5D.ttf"
          cp assets/fonts/Cairo-Regular.ttf assets/fonts/Cairo-Bold.ttf
          echo "✅ Fonts downloaded:"
          ls -la assets/fonts/

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build Web
        run: |
          flutter build web --release \
            --base-href=/hesabi_sales_rep/ \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
