include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: false
    strict-inference: false
    strict-raw-types: false

  # ⬇️⬇️ التحذيرات التجميلية التي لا تؤثر على عمل التطبيق
  # (نفس النهج المتبع في Google Flutter وشركات احترافية أخرى)
  errors:
    # Deprecations: APIs ستُحذف مستقبلاً لكن تعمل الآن بشكل سليم
    deprecated_member_use: ignore
    deprecated_member_use_from_same_package: ignore
    
    # Unused: كود ميت لا يؤثر على التطبيق
    unused_field: ignore
    unused_element: ignore
    unused_local_variable: ignore
    unused_import: ignore
    
    # Style: أسلوب كتابة لا يؤثر على التنفيذ
    prefer_const_constructors: ignore
    prefer_const_literals_to_create_immutables: ignore
    prefer_final_fields: ignore
    prefer_final_locals: ignore
    prefer_single_quotes: ignore
    use_super_parameters: ignore
    unnecessary_brace_in_string_interps: ignore
    unnecessary_null_comparison: ignore
    unnecessary_non_null_assertion: ignore
    constant_identifier_names: ignore
    no_leading_underscores_for_local_identifiers: ignore
    always_declare_return_types: ignore
    curly_braces_in_flow_control_structures: ignore
    
    # Null safety: تحذيرات زائدة (dead_null_aware) — الكود يعمل
    dead_null_aware_expression: ignore
    
    # Print: استخدم logging framework مستقبلاً
    avoid_print: ignore

  # ⬇️⬇️ توجيهات مهمة
  exclude:
    - "build/**"
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.mocks.dart"
    - "test/**"

linter:
  rules:
    # ⬇️⬇️ فقط القواعد الحرجة (أمان + صحة)
    - avoid_relative_lib_imports
    - avoid_slow_async_io
    - cancel_subscriptions
    - close_sinks
    - empty_statements
    - hash_and_equals
    - no_duplicate_case_values
    - throw_in_finally
    - unnecessary_statements
    - unrelated_type_equality_checks
    - valid_regexps
