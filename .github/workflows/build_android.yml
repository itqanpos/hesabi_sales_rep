name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: "android-build-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create Android platform (if missing)
        run: |
          if [ ! -d "android" ]; then
            echo "📱 Creating Android platform files..."
            flutter create --platforms=android --org com.itqanpos --project-name hesabi_sales_rep .
            echo "✅ Created"
          else
            echo "✅ Android platform already exists"
          fi

      - name: Ensure AndroidManifest has required permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "BLUETOOTH_CONNECT" "$MANIFEST"; then
            echo "🔧 Adding permissions..."
            sed -i 's#</manifest>#    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30"/>\n    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30"/>\n    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation"/>\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n</manifest>#' "$MANIFEST"
            echo "✅ Permissions added"
          else
            echo "✅ Permissions already present"
          fi

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build Release APK
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Check APK size
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          if [ -f "$APK" ]; then
            SIZE=$(du -h "$APK" | cut -f1)
            echo "APK Size: $SIZE"
            echo "APK_SIZE=$SIZE" >> $GITHUB_ENV
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hesabi-sales-rep-apk-v${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Build summary
        run: |
          {
            echo "## ✅ تم بناء APK بنجاح"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **الإصدار** | v${{ github.run_number }} |"
            echo "| **حجم APK** | ${{ env.APK_SIZE }} |"
            echo "| **النوع** | Release (Debug Signed) |"
            echo ""
            echo "### 📥 كيفية التحميل:"
            echo "1. انزل لأسفل إلى قسم **Artifacts**"
            echo "2. اضغط على **hesabi-sales-rep-apk-v${{ github.run_number }}**"
            echo "3. حمّل الـ zip وفك الضغط"
            echo "4. ثبّت **app-release.apk** على جهاز الأندرويد"
          } >> $GITHUB_STEP_SUMMARY
