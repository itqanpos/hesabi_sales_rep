name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: "android-build-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Create Android platform (if missing)
        run: |
          if [ ! -d "android" ]; then
            echo "📱 Creating Android platform..."
            flutter create --platforms=android --org com.itqanpos --project-name hesabi_sales_rep .
          fi

      - name: Fix v1 embedding issue in AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          # استبدال أي إشارة لـ v1 بـ v2 (إذا وجدت)
          sed -i 's#io.flutter.app.FlutterApplication#${applicationName}#g' "$MANIFEST"
          sed -i 's#io.flutter.app.android.SplashScreenUntilFirstFrame#flutterEmbedding#g' "$MANIFEST"
          echo "✅ Manifest fixed."

      # ⬇️⬇️ تحميل خطوط Cairo من مستودع Google Fonts الرسمي ⬇️⬇️
      - name: Download Cairo fonts
        run: |
          mkdir -p assets/fonts
          # تحميل ملفات الخطوط (Regular & Bold) إلى مجلد assets/fonts
          curl -L -o assets/fonts/Cairo-Regular.ttf "https://github.com/google/fonts/raw/main/ofl/cairo/static/Cairo-Regular.ttf"
          curl -L -o assets/fonts/Cairo-Bold.ttf "https://github.com/google/fonts/raw/main/ofl/cairo/static/Cairo-Bold.ttf"
          echo "✅ Fonts downloaded to assets/fonts/"
          ls -la assets/fonts/

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build Release APK
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Check APK size
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          if [ -f "$APK" ]; then
            SIZE=$(du -h "$APK" | cut -f1)
            echo "APK_SIZE=$SIZE" >> $GITHUB_ENV
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hesabi-sales-rep-apk-v${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Summary
        run: |
          {
            echo "## ✅ تم بناء APK بنجاح"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **الإصدار** | v${{ github.run_number }} |"
            echo "| **حجم APK** | ${{ env.APK_SIZE }} |"
            echo ""
            echo "### 📥 التحميل:"
            echo "1. انزل لأسفل → **Artifacts**"
            echo "2. اضغط على **hesabi-sales-rep-apk-v${{ github.run_number }}**"
            echo "3. فك ضغط zip → ثبّت **app-release.apk**"
          } >> $GITHUB_STEP_SUMMARY
